---
layout: default
---
<article class="post">

  <div class="post-content">

    {% if site.profile_picture %}
      {% include base.html %}
      <div class="right-column">
        <img src="{{ site.profile_picture | prepend: '/' | prepend: base }}" class="profile-picture" alt="{{ site.author }} profile picture"></img>
      </div>
    {% endif %}
    
    <div class = "left-column">
      {{ content }}
    </div>
  </div>

  <br />
  <div class="post-content">
  





</article>
